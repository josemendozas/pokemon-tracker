<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gundam TCG · Phantom Aria · Tracker</title>
<style>
  :root {
    --bg: #faf6ff;
    --bg-2: #f2ebfb;
    --panel: #ffffff;
    --panel-2: #f8f4fe;
    --border: #e5dcf0;
    --border-hi: #c9b6e6;
    --text: #2d2740;
    --muted: #8a83a0;
    --accent: #7c5cff;
    --es: #e94a75;
    --en: #2a94e0;
    --jp: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse at top, #ebe2fb 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  nav.topnav {
    background: rgba(255, 255, 255, 0.85);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    gap: 8px;
    align-items: center;
    backdrop-filter: blur(12px);
  }
  nav.topnav .brand {
    font-weight: 700;
    color: var(--accent);
    margin-right: 12px;
    font-size: 14px;
  }
  nav.topnav a {
    color: var(--muted);
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
  }
  nav.topnav a:hover { color: var(--text); background: var(--bg-2); }
  nav.topnav a.active { background: var(--accent); color: #fff; }

  header {
    position: sticky;
    top: 0;
    background: rgba(250, 246, 255, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    z-index: 100;
    padding: 16px 20px;
  }
  .header-inner { max-width: 1400px; margin: 0 auto; }
  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, #7c5cff, #2a94e0);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .stat .num { font-weight: 700; font-size: 16px; color: var(--text); }
  .stat.en .num { color: var(--en); }
  .stat.jp .num { color: var(--jp); }

  .controls {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .filter:hover { color: var(--text); border-color: var(--border-hi); }
  .filter.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .actions-menu { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .btn-icon {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
  }
  .btn-icon:hover { color: var(--text); border-color: var(--border-hi); }

  .grid {
    max-width: 1400px;
    margin: 20px auto 0;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    text-align: center;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    position: relative;
    box-shadow: 0 2px 8px rgba(80, 60, 130, 0.06);
  }
  .card:hover { transform: translateY(-3px); border-color: var(--border-hi); }
  .card[data-owned="true"] { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent), 0 6px 22px rgba(124, 92, 255, 0.22); }
  .img-wrap {
    aspect-ratio: 5 / 7;
    border-radius: 8px;
    overflow: hidden;
    background: #eee6f7;
    margin-bottom: 8px;
    position: relative;
  }
  .img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s, filter 0.3s; }
  .card[data-owned="false"] .img-wrap img { opacity: 0.35; filter: grayscale(1); }
  .img-wrap .missing-icon {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 12px;
  }
  .num { color: var(--muted); font-size: 11px; font-family: 'SF Mono', Menlo, monospace; margin-bottom: 6px; }
  .variants { display: flex; flex-direction: column; gap: 4px; }
  .variant-row {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-2);
    border-radius: 6px;
    padding: 4px 6px;
    justify-content: center;
  }
  .lang-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 4px;
    cursor: pointer;
    min-width: 30px;
  }
  .lang-btn:hover { border-color: var(--border-hi); }
  .lang-btn.on[data-lang="en"] { background: var(--en); border-color: var(--en); color: #fff; }
  .lang-btn.on[data-lang="jp"] { background: var(--jp); border-color: var(--jp); color: #fff; }

  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 12px;
    max-width: 1400px;
    margin-left: auto;
    margin-right: auto;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--jp), var(--accent), var(--en));
    transition: width 0.3s;
  }

  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 12px; }
    h1 { font-size: 18px; }
    .stat { padding: 6px 10px; font-size: 11px; }
  }
</style>
</head>
<body>

<nav class="topnav">
  <span class="brand">TCG Tracker</span>
  <a href="index.html">Pokémon</a>
  <a href="gundam.html" class="active">Gundam</a>
  <a href="jugar.html">Jugar</a>
</nav>

<header>
  <div class="header-inner">
    <h1>Phantom Aria · GD04</h1>
    <div class="subtitle">Gundam Card Game · 130 cartas base · Click EN o JP para marcar. Identifícalas por imagen.</div>
    <div class="stats">
      <div class="stat"><span class="num" id="stat-unique">0</span>/130 únicas</div>
      <div class="stat en"><span class="num" id="stat-en">0</span> en inglés</div>
      <div class="stat jp"><span class="num" id="stat-jp">0</span> en japonés</div>
    </div>
    <div class="controls">
      <button class="filter active" data-filter="all">Todas</button>
      <button class="filter" data-filter="missing">Me faltan</button>
      <button class="filter" data-filter="owned">Las que tengo</button>
      <div class="actions-menu">
        <span id="auth-status" style="font-size:11px;color:var(--muted);align-self:center;margin-right:8px;">Sin sesión (local)</span>
        <button class="btn-icon" id="signin">Iniciar sesión</button>
        <button class="btn-icon" id="signout" style="display:none;">Cerrar sesión</button>
        <button class="btn-icon" id="export">↓ Exportar</button>
        <button class="btn-icon" id="import">↑ Importar</button>
        <button class="btn-icon" id="reset">Borrar</button>
      </div>
    </div>
    <div class="progress-bar" style="margin-top:12px;">
      <div class="progress-fill" id="progress"></div>
    </div>
  </div>
</header>

<div class="grid" id="grid"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhAIbx-aUIcRIAsVEOzpuWqr4veqajQnQ",
  authDomain: "pokemon-jams.firebaseapp.com",
  projectId: "pokemon-jams",
  storageBucket: "pokemon-jams.firebasestorage.app",
  messagingSenderId: "595146847366",
  appId: "1:595146847366:web:d3391ba0fc242698804d07",
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const provider = new GoogleAuthProvider();

const IMG_BASE = "https://tcgtopdecks-hq.com/wp-content/gallery/gd04/GD04-";
const STORAGE_KEY = "gundam_phantom_aria_collection_v1";
const SET_KEY = "gundam_phantom_aria";
const TOTAL_CARDS = 130;

let state = loadLocalState();
let filter = "all";
let currentUser = null;
let unsubscribeSnapshot = null;

function loadLocalState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveLocalState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function saveState() {
  saveLocalState();
  if (currentUser) {
    setDoc(doc(db, "users", currentUser.uid), { [SET_KEY]: state }, { merge: true })
      .catch(err => console.error("Firestore save failed:", err));
  }
}

function getSlot(n) { return state[n] || {en:false, jp:false}; }
function setSlot(n, lang, value) {
  if (!state[n]) state[n] = {en:false, jp:false};
  state[n][lang] = value;
  if (!state[n].en && !state[n].jp) delete state[n];
  saveState();
}
function isOwned(n) {
  const s = state[n];
  return s && (s.en || s.jp);
}

function pad3(n) { return String(n).padStart(3, "0"); }

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  let unique = 0, enCount = 0, jpCount = 0;

  for (let n = 1; n <= TOTAL_CARDS; n++) {
    const s = getSlot(n);
    const owned = isOwned(n);
    if (owned) unique++;
    if (s.en) enCount++;
    if (s.jp) jpCount++;

    if (filter === "missing" && owned) continue;
    if (filter === "owned" && !owned) continue;

    const div = document.createElement("div");
    div.className = "card";
    div.dataset.owned = owned ? "true" : "false";
    div.innerHTML = `
      <div class="img-wrap">
        <img src="${IMG_BASE}${pad3(n)}.webp" alt="GD04-${pad3(n)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="missing-icon">Sin imagen</div>
      </div>
      <div class="num">GD04-${pad3(n)}</div>
      <div class="variants">
        <div class="variant-row">
          <button class="lang-btn ${s.en?'on':''}" data-lang="en" data-n="${n}">EN</button>
          <button class="lang-btn ${s.jp?'on':''}" data-lang="jp" data-n="${n}">JP</button>
        </div>
      </div>
    `;
    grid.appendChild(div);
  }

  grid.querySelectorAll(".lang-btn").forEach(btn => {
    btn.onclick = () => {
      const n = +btn.dataset.n;
      const lang = btn.dataset.lang;
      const cur = getSlot(n)[lang];
      setSlot(n, lang, !cur);
      render();
    };
  });

  document.getElementById("stat-unique").textContent = unique;
  document.getElementById("stat-en").textContent = enCount;
  document.getElementById("stat-jp").textContent = jpCount;
  document.getElementById("progress").style.width = (unique / TOTAL_CARDS * 100) + "%";
}

document.querySelectorAll(".filter").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".filter").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    filter = btn.dataset.filter;
    render();
  };
});

document.getElementById("export").onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "gundam_phantom_aria_" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  URL.revokeObjectURL(url);
};
document.getElementById("import").onclick = () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json";
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try { state = JSON.parse(ev.target.result); saveState(); render(); }
      catch { alert("Archivo inválido"); }
    };
    reader.readAsText(file);
  };
  input.click();
};
document.getElementById("reset").onclick = () => {
  if (confirm("¿Borrar toda la colección de Phantom Aria?")) {
    state = {}; saveState(); render();
  }
};

const authStatusEl = document.getElementById("auth-status");
const signinBtn = document.getElementById("signin");
const signoutBtn = document.getElementById("signout");
signinBtn.onclick = () => signInWithPopup(auth, provider).catch(err => alert("Error: " + err.message));
signoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
  currentUser = user;
  if (user) {
    authStatusEl.textContent = "☁ " + (user.displayName || user.email);
    authStatusEl.style.color = "var(--accent)";
    signinBtn.style.display = "none";
    signoutBtn.style.display = "inline-block";
    const userDoc = doc(db, "users", user.uid);
    let firstSnap = true;
    unsubscribeSnapshot = onSnapshot(userDoc, snap => {
      const remote = snap.exists() ? (snap.data()[SET_KEY] || {}) : {};
      if (firstSnap) {
        firstSnap = false;
        const localHasData = Object.keys(state).length > 0;
        const remoteHasData = Object.keys(remote).length > 0;
        if (localHasData && !remoteHasData) {
          if (confirm("Tenías cartas marcadas localmente. ¿Subirlas a tu cuenta?")) {
            setDoc(userDoc, { [SET_KEY]: state }, { merge: true });
            return;
          }
        }
        state = remote;
      } else {
        state = remote;
      }
      saveLocalState();
      render();
    });
  } else {
    authStatusEl.textContent = "Sin sesión (local)";
    authStatusEl.style.color = "var(--muted)";
    signinBtn.style.display = "inline-block";
    signoutBtn.style.display = "none";
    state = loadLocalState();
    render();
  }
});

render();
</script>

</body>
</html>
